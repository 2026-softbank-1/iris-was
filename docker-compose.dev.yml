# 로컬 개발용 PostgreSQL. 실행은 `scripts/dev-db.sh` 를 쓴다(비밀번호 생성과 .env 갱신을 함께 한다).
# 운영 DB 가 아니다. 데이터는 named volume 에 남고, 컨테이너는 Docker(OrbStack) 시작 시 자동으로 다시 뜬다.
services:
  postgres:
    image: postgres:18
    container_name: iris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없다. scripts/dev-db.sh 로 실행한다}
      POSTGRES_DB: softbank_iris
    ports:
      # 이 컴퓨터에서만 접속한다. 같은 네트워크의 다른 기기에는 열지 않는다.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 이미지는 버전별 하위 디렉터리를 쓰므로 /var/lib/postgresql 을 마운트한다.
      - iris-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d softbank_iris"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iris-postgres-data:
