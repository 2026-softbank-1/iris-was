[project]
name = "was"
version = "0.1.0"
description = "Team Iris 배포 자동화 플랫폼 WAS (API 서버)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.106",
    "cryptography>=46",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    # 레포 구성 분석기(gate CLI). 고정 커밋으로 빌드한 wheel 이다. vendor/iris-analyzer-manifest.json
    "iris-analyzer==0.1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
iris-analyzer = { path = "vendor/iris_analyzer-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py313"
# 규칙 문서의 예시 코드는 포맷 대상이 아니다.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3·asyncpg 는 타입 스텁이 없다. AWS 호출은 app/clients/aws_clients.py 한곳에서만 한다.
module = ["boto3.*", "botocore.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 실제 PostgreSQL 이 필요한 테스트 (TEST_DATABASE_URL)"]

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.106",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
